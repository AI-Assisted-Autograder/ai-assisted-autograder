name: Gradescope Nightly Rerun

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
      timezone: America/New_York
    - cron: '0 5 * * *'
      timezone: America/New_York

permissions:
  contents: read

concurrency:
  group: gradescope-nightly-rerun
  cancel-in-progress: false

jobs:
  nightly-rerun:
    name: Trigger Gradescope AI-failure reruns
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run nightly rerun trigger
        env:
          GRADING_API_URL: ${{ secrets.GRADING_API_URL }}
          INTEGRATION_API_TOKEN: ${{ secrets.INTEGRATION_API_TOKEN }}
          GRADESCOPE_COURSE_ID: ${{ secrets.GRADESCOPE_COURSE_ID }}
          GRADESCOPE_USERNAME: ${{ secrets.GRADESCOPE_USERNAME }}
          GRADESCOPE_PASSWORD: ${{ secrets.GRADESCOPE_PASSWORD }}
          GRADESCOPE_ALLOW_RERUN: '1'
          NIGHTLY_TRIGGER_SOURCE: AI_FAILURES
          NIGHTLY_WAIT_FOR_COMPLETION: '0'
          HEADFUL: '0'
        run: |
          set -o pipefail
          npm run nightly:trigger 2>&1 | tee nightly-trigger.log

      - name: Upload nightly runner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-trigger-log-${{ github.run_id }}
          path: nightly-trigger.log
          if-no-files-found: ignore
          retention-days: 14
