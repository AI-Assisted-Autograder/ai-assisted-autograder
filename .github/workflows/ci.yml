name: CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  PLANTUML_VERSION: '1.2025.4'

jobs:
  # Node.js tests
  node-tests:
    name: E2E and TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Install Playwright Chromium
        id: playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main'
        run: npx playwright test
        env:
          GRADESCOPE_USERNAME: ${{ secrets.GRADESCOPE_USERNAME }}
          GRADESCOPE_PASSWORD: ${{ secrets.GRADESCOPE_PASSWORD }}
          INSTRUCTOR_USERNAME: ${{ secrets.INSTRUCTOR_USERNAME }}
          INSTRUCTOR_PASSWORD: ${{ secrets.INSTRUCTOR_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: TypeScript type check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.playwright.outcome == 'success' }}
        run: npm run typecheck

      - name: Run TypeScript unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.playwright.outcome == 'success' }}
        run: npx playwright test tests/unit/typescript

  # PowerShell tests
  powershell-tests:
    name: PowerShell Tests
    runs-on: ubuntu-slim
    timeout-minutes: 15

    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PowerShell
        shell: pwsh
        run: |
          $PSVersionTable

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser

      - name: Run PowerShell tests
        shell: pwsh
        run: |
          Invoke-Pester ./tests/unit/powershell -Output Detailed

  # Python tests
  python-tests:
    name: Python Tests
    runs-on: ubuntu-slim
    timeout-minutes: 15

    if: github.event_name == 'push' || github.event_name == 'pull_request'

    outputs:
      uml: ${{ steps.filter.outputs.uml }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect UML changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            uml:
              - 'docs/architecture/**.puml'
              - '.github/workflows/ci.yml'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install test dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Run AI grading tests
        run: |
          source .venv/bin/activate
          cd tests/unit/ai_grading_test
          pytest -v

      - name: Run web tests
        run: |
          source .venv/bin/activate
          cd tests/unit/web_test
          pytest -v

  # UML rendering
  render-uml:
    name: Render UML
    runs-on: ubuntu-latest
    needs: python-tests

    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          needs.python-tests.outputs.uml == 'true' &&
          (
            github.event_name == 'pull_request' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
          )
        )
      )

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache PlantUML jar
        id: cache-plantuml
        uses: actions/cache@v4
        with:
          path: ~/.plantuml
          key: plantuml-${{ env.PLANTUML_VERSION }}

      - name: Download PlantUML
        if: steps.cache-plantuml.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.plantuml
          curl -fsSL \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar" \
            -o ~/.plantuml/plantuml.jar

      - name: Check DECISIONS.md table of contents
        run: |
          python3 - docs/architecture/DECISIONS.md <<'PYEOF'
          import re, sys
          s = open(sys.argv[1]).read()

          def anchor(t):
              t = t.lower()
              t = re.sub(r'[^\w\s-]', '', t)
              return re.sub(r'\s+', '-', t.strip())

          want = []
          for m in re.finditer(r'^(#{2,3}) (.+)$', s, re.M):
              lvl, title = len(m.group(1)), m.group(2)
              if title == 'Contents':
                  continue
              want.append(f"{'  '*(lvl-2)}- [{title}](#{anchor(title)})")

          block = re.search(r'^## Contents\n\n(.*?)\n\n---', s, re.M | re.S)
          if not block:
              print('::error file=docs/architecture/DECISIONS.md::no Contents block')
              sys.exit(1)

          have = block.group(1).split('\n')
          if have != want:
              print('::error file=docs/architecture/DECISIONS.md::table of contents is stale')
              for l in set(want) - set(have):
                  print(f'  missing: {l.strip()}')
              for l in set(have) - set(want):
                  print(f'  extra:   {l.strip()}')
              sys.exit(1)
          PYEOF

      - name: Check @startuml names match filenames
        run: |
          drift=0
          for f in docs/architecture/*.puml; do
            base="$(basename "$f" .puml)"
            name="$(grep -m1 '^@startuml' "$f" | awk '{print $2}')"
            if [ "$name" != "$base" ]; then
              echo "::error file=$f::declares '@startuml $name'; output would be named '$name', not '$base'"
              drift=1
            fi
          done
          exit "$drift"

      - name: Check sequence-diagram note syntax
        run: |
          bad=0
          for f in docs/architecture/*.puml; do
            grep -q '^participant ' "$f" || continue
            if grep -qn '^[[:space:]]*note as ' "$f"; then
              line=$(grep -n '^[[:space:]]*note as ' "$f" | head -1 | cut -d: -f1)
              echo "::error file=$f,line=$line::sequence diagram uses a floating 'note as'; attach it with 'note over <participant>'"
              bad=1
            fi
          done
          exit "$bad"

      - name: Verify diagram syntax
        run: |
          status=0
          for f in docs/architecture/*.puml; do
            if out=$(java -jar ~/.plantuml/plantuml.jar \
                       -checkonly -failfast2 "$f" 2>&1); then
              echo "ok      $f"
            else
              status=1
              echo "FAILED  $f"
              echo "$out" | sed 's/^/          /'
              first=$(echo "$out" | grep -oE '\(line [0-9]+\)' | head -1 \
                      | grep -oE '[0-9]+' || true)
              if [ -n "$first" ]; then
                echo "::error file=$f,line=$first::PlantUML syntax error"
              else
                echo "::error file=$f::PlantUML syntax error"
              fi
            fi
          done
          exit "$status"

      - name: Remove previously rendered images
        run: |
          mkdir -p docs/architecture/rendered
          find docs/architecture/rendered -maxdepth 1 -type f \
            \( -name '*.svg' -o -name '*.png' \) -delete

      - name: Render SVG and PNG
        run: |
          java -Djava.awt.headless=true -jar ~/.plantuml/plantuml.jar \
            -tsvg -failfast2 \
            -o "$(pwd)/docs/architecture/rendered" \
            docs/architecture/*.puml

          java -Djava.awt.headless=true -jar ~/.plantuml/plantuml.jar \
            -tpng -failfast2 -DPLANTUML_LIMIT_SIZE=16384 \
            -o "$(pwd)/docs/architecture/rendered" \
            docs/architecture/*.puml

          ls -la docs/architecture/rendered

      - name: Upload rendered diagrams as artifact
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagrams
          path: docs/architecture/rendered/
          if-no-files-found: error

      - name: Check rendered diagrams are up to date (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- docs/architecture/rendered)" ]; then
            echo '::error::Rendered diagrams are out of date.'
            echo 'Run docs/architecture/render.sh and commit the result,'
            echo 'or merge to main and let the workflow commit it.'
            git status --short -- docs/architecture/rendered
            exit 1
          fi
          echo 'Rendered diagrams are up to date.'

      - name: Commit rendered diagrams (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A docs/architecture/rendered

          if git diff --cached --quiet; then
            echo 'No diagram changes to commit.'
            exit 0
          fi

          git commit -m 'docs: re-render UML diagrams [skip ci]'
          git push