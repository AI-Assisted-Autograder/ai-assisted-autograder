name: Render UML

on:
  push:
    branches: [main]
    paths:
      - 'docs/architecture/**.puml'
      - '.github/workflows/render-uml.yml'
  pull_request:
    paths:
      - 'docs/architecture/**.puml'
      - '.github/workflows/render-uml.yml'
  workflow_dispatch:

# Pin the PlantUML version so a diagram does not silently change
# appearance because upstream shipped a new layout engine.
env:
  PLANTUML_VERSION: '1.2025.4'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache PlantUML jar
        id: cache-plantuml
        uses: actions/cache@v4
        with:
          path: ~/.plantuml
          key: plantuml-${{ env.PLANTUML_VERSION }}

      - name: Download PlantUML
        if: steps.cache-plantuml.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.plantuml
          curl -fsSL \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar" \
            -o ~/.plantuml/plantuml.jar

      # DECISIONS.md carries a generated table of contents. Fail if it no
      # longer matches the headings, so a renamed section cannot leave a
      # stale link behind.
      - name: Check DECISIONS.md table of contents
        run: |
          python3 - docs/architecture/DECISIONS.md <<'PYEOF'
          import re, sys
          s = open(sys.argv[1]).read()
          def anchor(t):
              t = t.lower()
              t = re.sub(r'[^\w\s-]', '', t)
              return re.sub(r'\s+', '-', t.strip())
          want = []
          for m in re.finditer(r'^(#{2,3}) (.+)$', s, re.M):
              lvl, title = len(m.group(1)), m.group(2)
              if title == 'Contents':
                  continue
              want.append(f"{'  '*(lvl-2)}- [{title}](#{anchor(title)})")
          block = re.search(r'^## Contents\n\n(.*?)\n\n---', s, re.M | re.S)
          if not block:
              print('::error file=docs/architecture/DECISIONS.md::no Contents block')
              sys.exit(1)
          have = block.group(1).split('\n')
          if have != want:
              print('::error file=docs/architecture/DECISIONS.md::table of contents is stale')
              for l in set(want) - set(have):
                  print(f'  missing: {l.strip()}')
              for l in set(have) - set(want):
                  print(f'  extra:   {l.strip()}')
              sys.exit(1)
          PYEOF

      # PlantUML names output from the "@startuml <name>" directive, not
      # from the filename. If they drift, a rename produces output under
      # the old name and the stale file looks legitimate.
      - name: Check @startuml names match filenames
        run: |
          drift=0
          for f in docs/architecture/*.puml; do
            base="$(basename "$f" .puml)"
            name="$(grep -m1 '^@startuml' "$f" | awk '{print $2}')"
            if [ "$name" != "$base" ]; then
              echo "::error file=$f::declares '@startuml $name'; output would be named '$name', not '$base'"
              drift=1
            fi
          done
          exit "$drift"

      # Check one file at a time. Across a glob, PlantUML reports only
      # "Some diagram description contains errors" and exits 200 without
      # naming the file, which is useless in CI. Per-file, the output is
      # attributable and lands as a GitHub annotation on the right file.
      # Sequence diagrams cannot use a floating "note as X". Notes there
      # must be attached: note over / note left of / note right of.
      # PlantUML reports this only as the generic "contains errors", so
      # catch it here where the message can say what is wrong.
      - name: Check sequence-diagram note syntax
        run: |
          bad=0
          for f in docs/architecture/*.puml; do
            grep -q '^participant ' "$f" || continue
            if grep -qn '^[[:space:]]*note as ' "$f"; then
              line=$(grep -n '^[[:space:]]*note as ' "$f" | head -1 | cut -d: -f1)
              echo "::error file=$f,line=$line::sequence diagram uses a floating 'note as'; attach it with 'note over <participant>'"
              bad=1
            fi
          done
          exit "$bad"

      - name: Verify diagram syntax
        run: |
          status=0
          for f in docs/architecture/*.puml; do
            if out=$(java -jar ~/.plantuml/plantuml.jar \
                       -checkonly -failfast2 "$f" 2>&1); then
              echo "ok      $f"
            else
              status=1
              echo "FAILED  $f"
              echo "$out" | sed 's/^/          /'
              first=$(echo "$out" | grep -oE '\(line [0-9]+\)' | head -1 \
                      | grep -oE '[0-9]+' || true)
              if [ -n "$first" ]; then
                echo "::error file=$f,line=$first::PlantUML syntax error"
              else
                echo "::error file=$f::PlantUML syntax error"
              fi
            fi
          done
          exit "$status"

      # Delete previously rendered images before regenerating. Without
      # this, a renamed or deleted .puml leaves an orphaned .svg/.png in
      # the repo forever. Worse, the freshness check below is a git diff,
      # and an orphan is not a *change*, so it would pass clean while
      # stale diagrams accumulate. Scoped to the two generated
      # extensions so .gitkeep survives.
      - name: Remove previously rendered images
        run: |
          mkdir -p docs/architecture/rendered
          find docs/architecture/rendered -maxdepth 1 -type f \
            \( -name '*.svg' -o -name '*.png' \) -delete

      - name: Render SVG and PNG
        run: |
          java -Djava.awt.headless=true -jar ~/.plantuml/plantuml.jar \
            -tsvg -failfast2 \
            -o "$(pwd)/docs/architecture/rendered" \
            docs/architecture/*.puml
          java -Djava.awt.headless=true -jar ~/.plantuml/plantuml.jar \
            -tpng -failfast2 -DPLANTUML_LIMIT_SIZE=16384 \
            -o "$(pwd)/docs/architecture/rendered" \
            docs/architecture/*.puml
          ls -la docs/architecture/rendered

      - name: Upload rendered diagrams as artifact
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagrams
          path: docs/architecture/rendered/
          if-no-files-found: error

      # On a pull request, do not commit. Just report whether the
      # checked-in images match the sources, so a stale diagram cannot be
      # merged. This also avoids the permission failure that
      # commit-to-PR hits on forks.
      #
      # `git status --porcelain` rather than `git diff --quiet`: diff
      # alone does not report untracked additions, and after the delete
      # step above a newly named file arrives as untracked.
      - name: Check rendered diagrams are up to date (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- docs/architecture/rendered)" ]; then
            echo '::error::Rendered diagrams are out of date.'
            echo 'Run docs/architecture/render.sh and commit the result,'
            echo 'or merge to main and let the workflow commit it.'
            git status --short -- docs/architecture/rendered
            exit 1
          fi
          echo 'Rendered diagrams are up to date.'

      # On a push to main, commit the refreshed images so the README and
      # docs site show current diagrams without anyone installing
      # Graphviz. `git add -A` on the directory stages deletions as well
      # as additions, which is what retires an orphaned image.
      - name: Commit rendered diagrams (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/architecture/rendered
          if git diff --cached --quiet; then
            echo 'No diagram changes to commit.'
            exit 0
          fi
          git commit -m 'docs: re-render UML diagrams [skip ci]'
          git push
