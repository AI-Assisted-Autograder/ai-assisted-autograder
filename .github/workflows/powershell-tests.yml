
name: PowerShell Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  powershell-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell
        shell: bash
        run: |
          mkdir -p "$HOME/pwsh"
          curl -L https://aka.ms/powershell-release?tag=stable \
            -o "$HOME/pwsh/powershell.tar.gz"
          tar -xzf "$HOME/pwsh/powershell.tar.gz" -C "$HOME/pwsh"
          chmod +x "$HOME/pwsh/pwsh"
          echo "$HOME/pwsh" >> "$GITHUB_PATH"

      - name: Verify PowerShell
        shell: pwsh
        run: |
          $PSVersionTable

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser

      - name: Run PowerShell tests
        shell: pwsh
        run: |
          Invoke-Pester ./tests/unit/powershell -Output Detailed
