services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - feedback_data:/var/lib/ai-feedback
      - ${GOOGLE_ADC_DIR:-/dev/null}:/run/google:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://autograder:autograder@db:5432/autograder}
      INTEGRATION_API_TOKEN: ${INTEGRATION_API_TOKEN:-}
      FEEDBACK_STATE_PATH: ${FEEDBACK_STATE_PATH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      GOOGLE_APPLICATION_CREDENTIALS: /run/google/application_default_credentials.json
      PITT_API_KEY: ${PITT_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autograder
      POSTGRES_PASSWORD: autograder
      POSTGRES_DB: autograder
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autograder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  feedback_data:
