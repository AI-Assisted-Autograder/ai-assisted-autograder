<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Assignments{% endblock %} · AI-Assisted Autograder</title>
    <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site">
        <a class="brand" href="/">AI-Assisted Autograder</a>
        {% if request.state.instructor %}
        <nav><a href="/">Assignments</a><a href="/settings/ai">AI settings</a></nav>
        <form class="signed-in" method="post" action="/logout">
            <span class="sub">{{ request.state.instructor.label }}</span>
            <button type="submit" class="link">Sign out</button>
        </form>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
