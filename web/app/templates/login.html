{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<div class="login">
    <h1>Instructor sign in</h1>

    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}

    <form class="card form" method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label>
            Email
            <input type="email" name="email" value="{{ email }}" required autocomplete="username"
                {% if not email %}autofocus{% endif %}>
        </label>
        <label>
            Password
            <input type="password" name="password" required autocomplete="current-password"
                {% if email %}autofocus{% endif %}>
        </label>
        <div class="actions">
            <button type="submit">Sign in</button>
        </div>
    </form>
    <p class="hint">No account? Ask whoever runs this server to add you.</p>
</div>
{% endblock %}
