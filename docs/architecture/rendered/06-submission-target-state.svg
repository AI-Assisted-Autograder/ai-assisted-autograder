<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="987px" preserveAspectRatio="none" style="width:1273px;height:987px;background:#FFFFFF;" version="1.1" viewBox="0 0 1273 987" width="1273px" zoomAndPan="magnify"><title>submission_target -- derived states</title><defs/><g><g class="title" data-source-line="17"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="280.1094" x="489.6699" y="22.9951">submission_target -- derived states</text></g><g id="WANTS"><rect fill="#F1F1F1" height="106.1406" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.291" x="677.5" y="387.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="677.5" x2="945.791" y1="413.5938" y2="413.5938"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.8408" x="755.2251" y="405.292">Wants feedback</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="225.6387" x="682.5" y="429.7324">ai_needed TRUE, completed_at NULL.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="248.291" x="682.5" y="443.7012">In NIGHTLY mode this is exactly what the</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="222.7266" x="682.5" y="457.6699">trigger queries. In IMMEDIATE it lasts</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="229.3828" x="682.5" y="471.6387">only until the AI phase runs, moments</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="166.9512" x="682.5" y="485.6074">later in the same container.</text></g><g id="OPTED"><rect fill="#F1F1F1" height="78.2031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="276.0371" x="673.5" y="710.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="673.5" x2="949.5371" y1="736.5938" y2="736.5938"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="70.2734" x="776.3818" y="728.292">Opted out</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="106.3008" x="678.5" y="752.7324">ai_needed FALSE.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="235.2246" x="678.5" y="766.7012">Her suite called ai_not_needed, usually</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="256.0371" x="678.5" y="780.6699">because the test passed. No tokens spent.</text></g><g id="DONE"><rect fill="#F1F1F1" height="78.2031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="281.9492" x="984.5" y="710.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="984.5" x2="1266.4492" y1="736.5938" y2="736.5938"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="138.0518" x="1056.4487" y="728.292">Feedback produced</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="207.4395" x="989.5" y="752.7324">completed_at set, last_error NULL.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="261.9492" x="989.5" y="766.7012">Feedback rows exist and have been spliced</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="99.4277" x="989.5" y="780.6699">into results.json.</text></g><g id="FAILED"><rect fill="#F1F1F1" height="106.1406" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="255.207" x="7" y="696.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="262.207" y1="722.5938" y2="722.5938"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="148.709" x="60.249" y="714.292">Attempted and failed</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="230.1152" x="12" y="738.7324">completed_at set, last_error recorded.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="235.207" x="12" y="752.7012">The AI phase retried inside the run and</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="212.9824" x="12" y="766.6699">still failed, so it appended a note to</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="230.6074" x="12" y="780.6387">results.json saying feedback could not</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="84.6094" x="12" y="794.6074">be generated.</text></g><g class="entity" data-entity="N2" data-source-line="80" data-uid="ent0006" id="entity_N2"><path d="M856,43.2969 L856,280.2891 L1201.0669,280.2891 L1201.0669,53.2969 L1191.0669,43.2969 L856,43.2969" fill="#FFF8DC" style="stroke:#181818;stroke-width:0.5;"/><path d="M1191.0669,43.2969 L1191.0669,53.2969 L1201.0669,53.2969 L1191.0669,43.2969" fill="#FFF8DC" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="238.0181" x="862" y="60.3638">Two questions, two mechanisms</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="272.251" x="862" y="75.4966">ai_needed asks whether this target wants</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="262.7041" x="862" y="90.6294">feedback. It is the token saving, and the</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="292.3667" x="862" y="105.7622">instructor controls it from her own test suite.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="862" y="120.895">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="324.0669" x="862" y="136.0278">submission.ai_graded_submitted_at asks whether</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="252.0146" x="862" y="151.1606">this submission is finished. The nightly</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="280.522" x="862" y="166.2935">trigger filters on it, so a graded submission</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="289.3389" x="862" y="181.4263">is never rerun, and the AI phase re-checks it</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="268.4106" x="862" y="196.5591">to catch reruns the trigger did not cause.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="42.0088" x="862" y="211.6919">(AD-9)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="862" y="226.8247">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="296.5181" x="862" y="241.9575">Set that guard once every ai_needed row has</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="278.5605" x="862" y="257.0903">completed_at set, whether it succeeded or</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="40.1489" x="862" y="272.2231">failed.</text></g><ellipse cx="811.5" cy="161.7969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="811.5" cy="970.2969" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="811.5" cy="970.2969" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="58" data-uid="ent0003" id="entity_GMN2"><path d="M297,600.2969 L297,745.2969 L262.3,749.2969 L297,753.2969 L297,897.8203 A0,0 0 0 0 297,897.8203 L637.687,897.8203 A0,0 0 0 0 637.687,897.8203 L637.687,610.2969 L627.687,600.2969 L297,600.2969 A0,0 0 0 0 297,600.2969" fill="#FFF8DC" style="stroke:#181818;stroke-width:0.5;"/><path d="M627.687,600.2969 L627.687,610.2969 L637.687,610.2969 L627.687,600.2969" fill="#FFF8DC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="253.4302" x="303" y="617.3638">Failure is terminal, in both modes.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="289.4468" x="303" y="632.4966">There is no cross-night retry and no attempt</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="288.3804" x="303" y="647.6294">counter. Retries happen inside one AI phase</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="300.6694" x="303" y="662.7622">run, with backoff on transient errors and none</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="288.7993" x="303" y="677.895">on deterministic ones, and never outlive the</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="54.374" x="303" y="693.0278">process.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="303" y="708.1606">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="265.9478" x="303" y="723.2935">This is why completed_at is set here too.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="319.687" x="303" y="738.4263">Leaving it NULL would mean the NIGHTLY trigger</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="290.7163" x="303" y="753.5591">picked the row up again every night forever,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="266.4175" x="303" y="768.6919">since its query is exactly "ai_needed and</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="152.7246" x="303" y="783.8247">completed_at IS NULL".</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="303" y="798.9575">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="294.563" x="303" y="814.0903">What DOES get retried the next night is work</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="306.0015" x="303" y="829.2231">that was never attempted, because the trigger</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="290.9131" x="303" y="844.356">job failed or a service was down. Those rows</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="301.3042" x="303" y="859.4888">still have completed_at NULL. "The job did not</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="294.0933" x="303" y="874.6216">run" self-heals; "grading ran and failed" does</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="25.4224" x="303" y="889.7544">not.</text></g><!--link *start* to WANTS--><g class="link" data-entity-1=".start." data-entity-2="WANTS" data-source-line="27" data-uid="lnk3" id="link_.start._WANTS"><path d="M811.5,171.9969 C811.5,205.0269 811.5,313.2769 811.5,381.2569" fill="none" id="*start*-to-WANTS" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="811.5,387.2569,815.5,378.2569,811.5,382.2569,807.5,378.2569,811.5,387.2569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="198.9038" x="812.5889" y="323.3638">the submission first reports in.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="199.0815" x="812.5" y="338.4966">One row per registered target,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="120.6753" x="851.7031" y="353.6294">ai_needed = TRUE</text></g><!--link WANTS to OPTED--><g class="link" data-entity-1="WANTS" data-entity-2="OPTED" data-source-line="49" data-uid="lnk4" id="link_WANTS_OPTED"><path d="M811.5,493.3769 C811.5,554.7869 811.5,649.4069 811.5,704.0669" fill="none" id="WANTS-to-OPTED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="811.5,710.0669,815.5,701.0669,811.5,705.0669,807.5,701.0669,811.5,710.0669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="90.6763" x="847.1392" y="536.3638">her suite calls</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="144.5044" x="820.2251" y="551.4966">ai_not_needed(target)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="159.9546" x="812.5" y="566.6294">during functional testing</text></g><!--link WANTS to DONE--><g class="link" data-entity-1="WANTS" data-entity-2="DONE" data-source-line="50" data-uid="lnk5" id="link_WANTS_DONE"><path d="M938.67,493.3569 C953.58,502.1869 967.93,512.1569 980.5,523.2969 C1040.85,576.7669 1083.4579,655.672 1106.2879,704.482" fill="none" id="WANTS-to-DONE" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1108.83,709.9169,1108.6402,700.0698,1106.7116,705.3878,1101.3936,703.4593,1108.83,709.9169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="185.5103" x="1021.5" y="551.3638">AI phase produced feedback</text></g><!--link WANTS to FAILED--><g class="link" data-entity-1="WANTS" data-entity-2="FAILED" data-source-line="51" data-uid="lnk6" id="link_WANTS_FAILED"><path d="M677.36,462.0169 C564.94,483.7669 403.4,525.5169 279.5,600.2969 C238.39,625.1069 204.5715,659.6962 177.9415,691.5062" fill="none" id="WANTS-to-FAILED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="174.09,696.1069,182.9343,691.7735,177.2996,692.273,176.8001,686.6382,174.09,696.1069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="131.3521" x="446.5" y="543.8638">AI phase failed after</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="104.2793" x="460.0364" y="558.9966">its in-run retries</text></g><!--link DONE to *end*--><g class="link" data-entity-1="DONE" data-entity-2=".end." data-source-line="53" data-uid="lnk8" id="link_DONE_.end."><path d="M1091.66,788.3169 C1061.47,820.6069 1014.82,866.6169 967.5,898.2969 C917.06,932.0669 853.6346,955.1772 827.6346,963.9572" fill="none" id="DONE-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="821.95,965.8769,831.7567,966.7871,826.6872,964.2772,829.1972,959.2076,821.95,965.8769" style="stroke:#181818;stroke-width:1;"/></g><!--link OPTED to *end*--><g class="link" data-entity-1="OPTED" data-entity-2=".end." data-source-line="54" data-uid="lnk9" id="link_OPTED_.end."><path d="M811.5,788.4469 C811.5,840.1569 811.5,923.4869 811.5,953.2869" fill="none" id="OPTED-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="811.5,959.2869,815.5,950.2869,811.5,954.2869,807.5,950.2869,811.5,959.2869" style="stroke:#181818;stroke-width:1;"/></g><!--link FAILED to *end*--><g class="link" data-entity-1="FAILED" data-entity-2=".end." data-source-line="55" data-uid="lnk10" id="link_FAILED_.end."><path d="M171.09,802.5669 C197.29,835.6969 235.59,876.3169 279.5,898.2969 C375.94,946.5769 727.0067,965.3126 794.4667,968.5126" fill="none" id="FAILED-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="800.46,968.7969,791.6596,964.3749,795.4656,968.56,791.2806,972.3659,800.46,968.7969" style="stroke:#181818;stroke-width:1;"/></g><!--SRC=[hLPjZzf64FxEhnZH3qbFOBMfL2MfKeaMw25TkEgEz5JrgjDYh_46iqjtrqVuztrcriQGLEgNM4Z8tdcVPvxP5_JkQpo35nIQzSw4O9nzYiflTAJQb3e_vhN6wSghN0UAxYtDxyRVlnxntwitylV3ToDQul_7mGj8tbfDtXrehpszx8sEoEkD2L5xNL1oy6r6gqfJY2h2z5hNq5AUlKrdTui_PbCglTjHF3ZANTtiR1YHTH4AZeqOIqgKcq3QDhktufv8cIUhTG49VWh7OLScj4xfe6oaoO9AoAnLlXMTtEtsjOwwU5AHw51f2ntDOljA1KsbiIPKC7amiKhca2FI_d1pGwOa4yNCvGDDYTStbeuwPdGFzywYqZbg6MYodF9hgKpTU9s9XLg5-AIzTvuj156eZ-mYLWWjnO4S0d9l5INjNnpYsdXL6BkXdIkae9LwrcGARQF9LGqp5QgVqUBz-zbqCLdDIDc2belVhbStVy96OSeIJKiEBJrSpvQNLK0YWSFyEf0RH1Dh_H-u6u-fqDuyezm96uD1s1gxLrxjA5IgS0VEibHrq6SdXIvLKyUvit6fTfgkTVsiENEeinaQFg3ruTJu8Q6A3vFbwhuxlzq30UIQA4Utlwzcq-vetYhHthkYoNKX8jFRvQoJcCIeTsA0gygzQONcayKD30t-kleRgVsSND9RAMsVF5hh0x2YzyuZI6EpHti-IbzCp-ZHzaX_Hwkx3xF1eBFTd_3tqIM-6RJPINHXEmW8RXAuyTEVL1w1X0FZ3h6U5A8tcmqY-gT1atJ8s48FAHC5m-4aBd1g0C7wIp2Du787UFRIDMhf6NrI7MvZZdugOxNF1WDfoKLwyydD_Imx7Ln3EJG6_M30SoyWwM8hFQ8cD3m89_crpbKJj7W3q2BjLGYwo6Zfm7LRRGE5FGA4R-urD2ugYVaSdOzigcmhUO8CMiZbHFi46ZALQmsA2VlQ04gTWh7HeSy180xPn-0il2Rm_9zVhtFdaM3MowykQgtHDA7CO8gKBPCIekaL0ZfKjxWTKN3SIRL7ybncnKG6HTVBdmUAJXrb9BkKSzVK1UlqycjD6uqsei68isqupqFNY-gYTo71-zIxb-tEUBH5uyLNO_E8mL6rT0wVpcos5JqLe9lQdlLxsLE4FTjB4KYLmEAZDJAEOovOgcDemS3A6EeMJDrRQwvx7KZXC38LgBpid7qpdyzVJtyT45rTpHEDyyp1tyuWen5Fm9efNQWykxg2v8hPcwKizg5t8OojMEMWZe8i7AZ4GWDUQHWwJ0tTfQ21E-vcXm5dUtn06jcDqdBZwhYovCqKlO8mu4y2iz0wiQo0uqAdU05iaxD1pBD8w6TU8qsimU52