<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="986px" preserveAspectRatio="none" style="width:1272px;height:986px;background:#FFFFFF;" version="1.1" viewBox="0 0 1272 986" width="1272px" zoomAndPan="magnify"><title>submission_target -- derived states</title><defs/><g><g class="title" data-source-line="17"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="280.1094" x="489.2349" y="22.9951">submission_target -- derived states</text></g><g id="WANTS"><rect fill="#F1F1F1" height="106.1406" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.291" x="676.46" y="387.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="676.46" x2="944.751" y1="413.5938" y2="413.5938"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.8408" x="754.1851" y="405.292">Wants feedback</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="225.6387" x="681.46" y="429.7324">ai_needed TRUE, completed_at NULL.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="248.291" x="681.46" y="443.7012">In NIGHTLY mode this is exactly what the</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="222.7266" x="681.46" y="457.6699">trigger queries. In IMMEDIATE it lasts</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="229.3828" x="681.46" y="471.6387">only until the AI phase runs, moments</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="166.9512" x="681.46" y="485.6074">later in the same container.</text></g><g id="OPTED"><rect fill="#F1F1F1" height="78.2031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="276.0371" x="672.58" y="710.0969"/><line style="stroke:#181818;stroke-width:0.5;" x1="672.58" x2="948.6171" y1="736.3938" y2="736.3938"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="70.2734" x="775.4618" y="728.092">Opted out</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="106.3008" x="677.58" y="752.5324">ai_needed FALSE.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="235.2246" x="677.58" y="766.5012">Her suite called ai_not_needed, usually</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="256.0371" x="677.58" y="780.4699">because the test passed. No tokens spent.</text></g><g id="DONE"><rect fill="#F1F1F1" height="78.2031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="281.9492" x="983.63" y="710.0969"/><line style="stroke:#181818;stroke-width:0.5;" x1="983.63" x2="1265.5792" y1="736.3938" y2="736.3938"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="138.0518" x="1055.5787" y="728.092">Feedback produced</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="207.4395" x="988.63" y="752.5324">completed_at set, last_error NULL.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="261.9492" x="988.63" y="766.5012">Feedback rows exist and have been spliced</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="99.4277" x="988.63" y="780.4699">into results.json.</text></g><g id="FAILED"><rect fill="#F1F1F1" height="106.1406" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="255.207" x="7" y="696.1269"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="262.207" y1="722.4238" y2="722.4238"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="148.709" x="60.249" y="714.122">Attempted and failed</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="230.1152" x="12" y="738.5624">completed_at set, last_error recorded.</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="235.207" x="12" y="752.5312">The AI phase retried inside the run and</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="212.9824" x="12" y="766.4999">still failed, so it appended a note to</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="230.6074" x="12" y="780.4687">results.json saying feedback could not</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="84.6094" x="12" y="794.4374">be generated.</text></g><g class="entity" data-entity="N2" data-source-line="80" data-uid="ent0006" id="entity_N2"><path d="M856.07,43.2969 L856.07,280.2891 L1201.1369,280.2891 L1201.1369,53.2969 L1191.1369,43.2969 L856.07,43.2969" fill="#FFF8DC" style="stroke:#181818;stroke-width:0.5;"/><path d="M1191.1369,43.2969 L1191.1369,53.2969 L1201.1369,53.2969 L1191.1369,43.2969" fill="#FFF8DC" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="238.0181" x="862.07" y="60.3638">Two questions, two mechanisms</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="272.251" x="862.07" y="75.4966">ai_needed asks whether this target wants</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="262.7041" x="862.07" y="90.6294">feedback. It is the token saving, and the</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="292.3667" x="862.07" y="105.7622">instructor controls it from her own test suite.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="862.07" y="120.895">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="324.0669" x="862.07" y="136.0278">submission.ai_graded_submitted_at asks whether</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="252.0146" x="862.07" y="151.1606">this submission is finished. The nightly</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="280.522" x="862.07" y="166.2935">trigger filters on it, so a graded submission</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="289.3389" x="862.07" y="181.4263">is never rerun, and the AI phase re-checks it</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="268.4106" x="862.07" y="196.5591">to catch reruns the trigger did not cause.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="42.0088" x="862.07" y="211.6919">(AD-9)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="862.07" y="226.8247">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="296.5181" x="862.07" y="241.9575">Set that guard once every ai_needed row has</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="278.5605" x="862.07" y="257.0903">completed_at set, whether it succeeded or</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="40.1489" x="862.07" y="272.2231">failed.</text></g><ellipse cx="810.6" cy="161.7969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="810.6" cy="969.9569" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="810.6" cy="969.9569" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="58" data-uid="ent0003" id="entity_GMN2"><path d="M297.26,600.4369 L297.26,745.1969 L262.41,749.1969 L297.26,753.1969 L297.26,897.9603 A0,0 0 0 0 297.26,897.9603 L637.947,897.9603 A0,0 0 0 0 637.947,897.9603 L637.947,610.4369 L627.947,600.4369 L297.26,600.4369 A0,0 0 0 0 297.26,600.4369" fill="#FFF8DC" style="stroke:#181818;stroke-width:0.5;"/><path d="M627.947,600.4369 L627.947,610.4369 L637.947,610.4369 L627.947,600.4369" fill="#FFF8DC" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="253.4302" x="303.26" y="617.5038">Failure is terminal, in both modes.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="289.4468" x="303.26" y="632.6366">There is no cross-night retry and no attempt</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="288.3804" x="303.26" y="647.7694">counter. Retries happen inside one AI phase</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="300.6694" x="303.26" y="662.9022">run, with backoff on transient errors and none</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="288.7993" x="303.26" y="678.035">on deterministic ones, and never outlive the</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="54.374" x="303.26" y="693.1678">process.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="303.26" y="708.3006">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="265.9478" x="303.26" y="723.4335">This is why completed_at is set here too.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="319.687" x="303.26" y="738.5663">Leaving it NULL would mean the NIGHTLY trigger</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="290.7163" x="303.26" y="753.6991">picked the row up again every night forever,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="266.4175" x="303.26" y="768.8319">since its query is exactly "ai_needed and</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="152.7246" x="303.26" y="783.9647">completed_at IS NULL".</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="303.26" y="799.0975">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="294.563" x="303.26" y="814.2303">What DOES get retried the next night is work</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="306.0015" x="303.26" y="829.3631">that was never attempted, because the trigger</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="290.9131" x="303.26" y="844.496">job failed or a service was down. Those rows</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="301.3042" x="303.26" y="859.6288">still have completed_at NULL. "The job did not</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="294.0933" x="303.26" y="874.7616">run" self-heals; "grading ran and failed" does</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="25.4224" x="303.26" y="889.8944">not.</text></g><!--link *start* to WANTS--><g class="link" data-entity-1=".start." data-entity-2="WANTS" data-source-line="27" data-uid="lnk3" id="link_.start._WANTS"><path d="M810.6,171.9969 C810.6,204.9869 810.6,312.9869 810.6,381.0169" fill="none" id="*start*-to-WANTS" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="810.6,387.0169,814.6,378.0169,810.6,382.0169,806.6,378.0169,810.6,387.0169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="198.9038" x="811.6889" y="323.3638">the submission first reports in.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="199.0815" x="811.6" y="338.4966">One row per registered target,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="120.6753" x="850.8031" y="353.6294">ai_needed = TRUE</text></g><!--link WANTS to OPTED--><g class="link" data-entity-1="WANTS" data-entity-2="OPTED" data-source-line="49" data-uid="lnk4" id="link_WANTS_OPTED"><path d="M810.6,493.7569 C810.6,555.0369 810.6,649.0169 810.6,703.6169" fill="none" id="WANTS-to-OPTED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="810.6,709.6169,814.6,700.6169,810.6,704.6169,806.6,700.6169,810.6,709.6169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="90.6763" x="846.2392" y="536.5038">her suite calls</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="144.5044" x="819.3251" y="551.6366">ai_not_needed(target)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="159.9546" x="811.6" y="566.7694">during functional testing</text></g><!--link WANTS to DONE--><g class="link" data-entity-1="WANTS" data-entity-2="DONE" data-source-line="50" data-uid="lnk5" id="link_WANTS_DONE"><path d="M938.2,493.7369 C952.95,502.5069 967.15,512.4069 979.6,523.4369 C1039.91,576.8569 1082.5235,655.6741 1105.3735,704.4241" fill="none" id="WANTS-to-DONE" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1107.92,709.8569,1107.7222,700.01,1105.7979,705.3295,1100.4784,703.4053,1107.92,709.8569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="185.5103" x="1020.69" y="551.5038">AI phase produced feedback</text></g><!--link WANTS to FAILED--><g class="link" data-entity-1="WANTS" data-entity-2="FAILED" data-source-line="51" data-uid="lnk6" id="link_WANTS_FAILED"><path d="M676.17,462.2869 C563.99,484.1269 403.09,525.9169 279.6,600.4369 C238.68,625.1269 204.9993,659.4528 178.3693,691.1528" fill="none" id="WANTS-to-FAILED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="174.51,695.7469,183.3617,691.4286,177.7261,691.9185,177.2363,686.2829,174.51,695.7469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="131.3521" x="445.4" y="544.0038">AI phase failed after</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="104.2793" x="458.9364" y="559.1366">its in-run retries</text></g><!--link DONE to *end*--><g class="link" data-entity-1="DONE" data-entity-2=".end." data-source-line="53" data-uid="lnk8" id="link_DONE_.end."><path d="M1090.16,788.7869 C1059.93,820.9869 1013.59,866.5369 966.6,897.9569 C916.15,931.7069 852.7244,954.8366 826.7344,963.6166" fill="none" id="DONE-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="821.05,965.5369,830.8568,966.446,825.787,963.9366,828.2964,958.8668,821.05,965.5369" style="stroke:#181818;stroke-width:1;"/></g><!--link OPTED to *end*--><g class="link" data-entity-1="OPTED" data-entity-2=".end." data-source-line="54" data-uid="lnk9" id="link_OPTED_.end."><path d="M810.6,788.5469 C810.6,840.0169 810.6,922.4469 810.6,952.5569" fill="none" id="OPTED-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="810.6,958.5569,814.6,949.5569,810.6,953.5569,806.6,949.5569,810.6,958.5569" style="stroke:#181818;stroke-width:1;"/></g><!--link FAILED to *end*--><g class="link" data-entity-1="FAILED" data-entity-2=".end." data-source-line="55" data-uid="lnk10" id="link_FAILED_.end."><path d="M171.5,802.7469 C197.7,835.7469 235.89,876.0869 279.6,897.9569 C375.88,946.1269 726.2668,964.9503 793.5968,968.1703" fill="none" id="FAILED-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="799.59,968.4569,790.7914,964.0315,794.5957,968.218,790.4092,972.0224,799.59,968.4569" style="stroke:#181818;stroke-width:1;"/></g><!--SRC=[hLPjZzf64FxEhnZH3qbFOBMfL2MfKeaMw25TkEgEz5JrgjDYh_46iqjtrqVuztrcriQGLEgNM4Z8tdcVPvxP5_JkQpo35nIQzSw4O9nzYiflTAJQb3e_vhN6wSghN0UAxYtDxyRVlnxntwitylV3ToDQul_7mGj8tbfDtXrehpszx8sEoEkD2L5xNL1oy6r6gqfJY2h2z5hNq5AUlKrdTui_PbCglTjHF3ZANTtiR1YHTH4AZeqOIqgKcq3QDhktufv8cIUhTG49VWh7OLScj4xfe6oaoO9AoAnLlXMTtEtsjOwwU5AHw51f2ntDOljA1KsbiIPKC7amiKhca2FI_d1pGwOa4yNCvGDDYTStbeuwPdGFzywYqZbg6MYodF9hgKpTU9s9XLg5-AIzTvuj156eZ-mYLWWjnO4S0d9l5INjNnpYsdXL6BkXdIkae9LwrcGARQF9LGqp5QgVqUBz-zbqCLdDIDc2belVhbStVy96OSeIJKiEBJrSpvQNLK0YWSFyEf0RH1Dh_H-u6u-fqDuyezm96uD1s1gxLrxjA5IgS0VEibHrq6SdXIvLKyUvit6fTfgkTVsiENEeinaQFg3ruTJu8Q6A3vFbwhuxlzq30UIQA4Utlwzcq-vetYhHthkYoNKX8jFRvQoJcCIeTsA0gygzQONcayKD30t-kleRgVsSND9RAMsVF5hh0x2YzyuZI6EpHti-IbzCp-ZHzaX_Hwkx3xF1eBFTd_3tqIM-6RJPINHXEmW8RXAuyTEVL1w1X0FZ3h6U5A8tcmqY-gT1atJ8s48FAHC5m-4aBd1g0C7wIp2Du787UFRIDMhf6NrI7MvZZdugOxNF1WDfoKLwyydD_Imx7Ln3EJG6_M30SoyWwM8hFQ8cD3m89_crpbKJj7W3q2BjLGYwo6Zfm7LRRGE5FGA4R-urD2ugYVaSdOzigcmhUO8CMiZbHFi46ZALQmsA2VlQ04gTWh7HeSy180xPn-0il2Rm_9zVhtFdaM3MowykQgtHDA7CO8gKBPCIekaL0ZfKjxWTKN3SIRL7ybncnKG6HTVBdmUAJXrb9BkKSzVK1UlqycjD6uqsei68isqupqFNY-gYTo71-zIxb-tEUBH5uyLNO_E8mL6rT0wVpcos5JqLe9lQdlLxsLE4FTjB4KYLmEAZDJAEOovOgcDemS3A6EeMJDrRQwvx7KZXC38LgBpid7qpdyzVJty